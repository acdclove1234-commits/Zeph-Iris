ShortDescription: Quiet, safe fan control and RGB lighting for Windows desktop PCs, set up in one click.
Description: |-
  Zeph-Iris drives your motherboard's fan headers from temperature curves, watches over the PC and lights the LEDs.
  One-button auto setup measures every fan, loads the CPU and GPU, and builds the quietest curve that still holds your target temperature.
  Safety features include emergency full speed, bad-sensor filtering, a pump watch, a watchdog process, and handing the fans back to the BIOS on exit.
  LEDs (through OpenRGB): temperature, rainbow, breathing and music sync with beat tracking.
  No account, no telemetry, no ads. The user interface is available in 18 languages. Installs the signed PawnIO driver for hardware access.
